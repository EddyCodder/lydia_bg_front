name: Despliegue a Producción (VPS Brittany — Lydia)

# Solo production por ahora (CRM-10): no existe todavia un entorno de
# desarrollo para Lydia, asi que a diferencia del resto del ecosistema esto
# no "cae a development" para cualquier otra rama -- simplemente rechaza
# cualquier rama que no sea main. El entorno nunca se elige a mano.

on:
  workflow_dispatch: {}

jobs:
  deploy:
    name: Desplegar Chatwoot (lydia_bg_front) en VPS
    runs-on: ubuntu-latest

    steps:
      - name: 🔒 Verificar rama de origen
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "::error::Lydia solo se despliega desde main (unico entorno: production). Este lanzamiento viene de '${{ github.ref_name }}'."
            exit 1
          fi

      - name: 📥 Descargar código
        uses: actions/checkout@v4

      # No se compila nada en el runner: el build de la imagen (bundle
      # install + assets de Vue/Vite) corre dentro del Dockerfile, en el
      # propio VPS, para no necesitar registry. rsync sube el codigo fuente
      # tal cual.
      - name: 🔑 Preparar clave SSH (VPS)
        run: |
          install -m 600 /dev/null /tmp/deploy_key
          echo "${{ secrets.VPS_SSH_KEY }}" > /tmp/deploy_key
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: 🚀 Sincronizar código fuente al VPS (rsync)
        run: |
          rsync -avz --delete \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='tmp/' \
            --exclude='public/packs/' \
            -e "ssh -i /tmp/deploy_key -o StrictHostKeyChecking=yes" \
            ./ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/lydia_prod/front/

      - name: 🛠️ Rebuild + reload en el VPS (SSH)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Timeout largo: bundle install + compilar assets de Chatwoot desde
          # cero puede tardar varios minutos, muy por encima del default.
          command_timeout: 20m
          script: |
            set -euo pipefail

            # Unico paso que necesita root (build + reinicio de web y
            # worker + migraciones): va por una regla de sudo acotada a este
            # comando exacto, mismo patron que deploy-reload-<proyecto>-prod
            # en el resto del VPS.
            sudo -n /usr/local/sbin/deploy-reload-lydia-front

            echo "Esperando a que Chatwoot responda en 127.0.0.1:3009 ..."
            for i in $(seq 1 30); do
              CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "http://127.0.0.1:3009/" || true)
              if [ "$CODE" != "000" ]; then echo "Arrancado correctamente (HTTP $CODE)"; exit 0; fi
              sleep 4
            done
            echo "ERROR: Chatwoot no respondio en 120 segundos. Revisar: docker logs lydia_chatwoot_web"
            exit 1

      - name: 🧹 Limpiar clave SSH temporal
        if: always()
        run: rm -f /tmp/deploy_key
